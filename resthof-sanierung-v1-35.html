button,input,select,textarea{font:inherit} button{cursor:pointer}

.main{flex:1;padding:26px;max-width:1500px;margin:auto;width:100%}.page-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}.page-head h1{margin:0;font-size:28px}.muted{color:var(--muted)}
.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:18px}.stat .label{color:var(--muted);font-size:13px}.stat .value{font-size:25px;font-weight:800;margin-top:4px}.stat .sub{font-size:12px;color:var(--muted);margin-top:5px}

.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:white;color:var(--text);border-radius:10px;padding:10px 14px}.btn.primary{background:var(--accent);color:white;border-color:var(--accent)}.btn.danger{color:white;background:var(--red);border-color:var(--red)}

.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.row-title{font-weight:700}.tag{display:inline-flex;align-items:center;border-radius:999px;padding:4px 8px;font-size:12px;background:#eef1f4;color:#425261}.tag.green{background:#e5f2eb;color:var(--green)}.tag.yellow{background:#fff3d7;color:#8c640d}.tag.red{background:#f9e4e4;color:var(--red)}

.notice{padding:12px 14px;border-radius:12px;background:#fff3d7;color:#7c5b14;border:1px solid #f0dfae;margin-bottom:12px}.danger-text{color:var(--red);font-weight:700}.success-text{color:var(--green);font-weight:700}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tab{padding:9px 12px;border-radius:9px;border:1px solid var(--line);background:white}.tab.active{background:var(--accent);color:white}
.chartbar{display:grid;gap:10px}.barline{display:grid;grid-template-columns:150px 1fr 90px;gap:10px;align-items:center}.bartrack{height:12px;background:#e9edf0;border-radius:99px;overflow:hidden}.barfill{height:100%;background:var(--accent2)}
.search{width:min(420px,100%);padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:white}

@media(max-width:900px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.nav{width:190px}}
@media(max-width:700px){.layout{display:block}.nav{position:fixed;bottom:0;left:0;right:0;width:auto;height:62px;z-index:20;flex-direction:row;padding:6px;justify-content:space-around}.nav button{font-size:11px;text-align:center;padding:7px 8px}.nav button span{display:block}.main{padding:18px 14px 82px}.topbar{height:60px;padding:0 14px}.stats{grid-template-columns:1fr 1fr}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.barline{grid-template-columns:100px 1fr 75px}.mobile-add{display:block;position:fixed;right:18px;bottom:76px;z-index:19;border-radius:50%;width:56px;height:56px;background:var(--accent);color:white;border:0;font-size:24px;box-shadow:var(--shadow)}}
@media(max-width:430px){.stats{grid-template-columns:1fr}.page-head{align-items:flex-start;flex-direction:column}}
.guest-mode .btn.primary,.guest-mode .btn.danger,.guest-mode .mobile-add{display:none!important}.guest-mode input:not([type="search"]),.guest-mode select,.guest-mode textarea{pointer-events:none;opacity:.75}.auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg)}
.auth-card{width:min(430px,100%);background:white;border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:var(--shadow)}
.auth-card h1{margin:0 0 6px}.auth-card p{color:var(--muted)}.auth-error{padding:10px 12px;border-radius:9px;background:#f9e4e4;color:var(--red);margin:12px 0}.auth-loading{color:var(--muted);text-align:center}
</style>

<body>
<div id="app"></div>
<script>
const SUPABASE_URL = "https://mfhcuawrtxijvpxosrzb.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_NIlOsKmu2wHARPtsv1QrKA_lfCfAp82";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
let authReady = false;
let authUser = null;
let authProject = null;
let authRole = null;
let authError = "";
let authProjectLoading = false;
let authLoadUserId = null;
let authLoadInFlight = null;
let authInitialised = false;


let inviteMode = false;
let passwordError = "";
let passwordSaved = false;

function hasAuthInviteInUrl(){
  const hash = new URLSearchParams((location.hash || "").replace(/^#/, ""));
  const query = new URLSearchParams(location.search || "");
  return hash.get("type") === "invite" || query.get("type") === "invite" ||
         !!hash.get("access_token") || !!query.get("access_token");
}

function inviteSetupStored(){
  try { return localStorage.getItem("resthof_invite_setup") === "1"; } catch(e) { return false; }
}
function rememberInviteSetup(){
  try { localStorage.setItem("resthof_invite_setup","1"); } catch(e) {}
}
function clearInviteSetup(){
  try { localStorage.removeItem("resthof_invite_setup"); } catch(e) {}
}

// Capture invitation state before supabase-js can clean the URL, and persist it
// so closing the tab does not discard an already-started password setup.
inviteMode = hasAuthInviteInUrl() || inviteSetupStored();
if(hasAuthInviteInUrl()) rememberInviteSetup();

function passwordSetupScreen(){
  return `<div class="auth-screen"><div class="auth-card">
    <h1>🔐 Passwort festlegen</h1>
    <p>Deine Einladung wurde erkannt. Lege jetzt dein persönliches Passwort für die Resthofsanierung fest.</p>
    <p style="font-size:.9em;opacity:.75">Falls du die Seite versehentlich schließt, kannst du die App erneut öffnen und hier weitermachen.</p>
    ${passwordError?`<div class="auth-error">${esc(passwordError)}</div>`:""}
    ${passwordSaved?`<div style="padding:10px 12px;border-radius:9px;background:#e7f4e8;margin:12px 0">Passwort gespeichert. Du wirst angemeldet …</div>`:""}
    <div class="field"><label>Neues Passwort</label><input id="newPassword" type="password" autocomplete="new-password" placeholder="Mindestens 8 Zeichen"></div>
    <div class="field" style="margin-top:12px"><label>Passwort wiederholen</label><input id="newPassword2" type="password" autocomplete="new-password" placeholder="Passwort wiederholen"></div>
    <button class="btn primary" style="width:100%;margin-top:16px" onclick="setInitialPassword()">Passwort speichern</button>
  </div></div>`;
}

async function setInitialPassword(){
  passwordError = "";
  const p1 = document.getElementById("newPassword")?.value || "";
  const p2 = document.getElementById("newPassword2")?.value || "";
  if(p1.length < 8){ passwordError="Das Passwort muss mindestens 8 Zeichen lang sein."; render(); return; }
  if(p1 !== p2){ passwordError="Die beiden Passwörter stimmen nicht überein."; render(); return; }

  const {error} = await supabaseClient.auth.updateUser({password:p1});
  if(error){ passwordError=error.message; render(); return; }

  passwordSaved = true;
  inviteMode = false;
  clearInviteSetup();
  try { history.replaceState({}, document.title, location.pathname); } catch(e) {}
  await loadAuthContext();
}

let authContextPromise = null;
let cloudStateLoaded = false;
let cloudSyncInFlight = false;
let supabaseSyncError = "";
let supabaseSyncInFlight = false;
let cloudSyncTimer = null;

// Never let a slow Supabase request keep the whole app on the
// "Verbindung wird hergestellt …" screen forever.
const AUTH_REQUEST_TIMEOUT = 10000;
// Separate timeout for normal Cloud/Supabase data requests.
const CLOUD_REQUEST_TIMEOUT = 15000;

function withTimeout(promise, ms=AUTH_REQUEST_TIMEOUT, label="Supabase-Anfrage"){
  return Promise.race([
    promise,
    new Promise((_,reject)=>setTimeout(()=>reject(new Error(`${label} dauert zu lange. Bitte prüfe die Supabase-Verbindung und versuche es erneut.`)),ms))
  ]);
}

async function loadAuthContext(force=false){
  // Never start two auth-context loads for the same user at once.
  if(authLoadInFlight && !force) return authLoadInFlight;

  authLoadInFlight = (async()=>{
    try{
      const {data:{session},error} = await withTimeout(
        supabaseClient.auth.getSession(),
        AUTH_REQUEST_TIMEOUT,
        "Die Anmeldung"
      );
      if(error) throw error;

      const user = session?.user || null;

      if(!user){
        authUser=null;
        authProject=null;
        authRole=null;
        authProjectLoading=false;
        cloudStateLoaded=false;
        authReady=true;
        authInitialised=false;
        authLoadUserId=null;
        render();
        return false;
      }

      authUser=user;

      // Do not repeat the project lookup for the same already-initialised user
      // just because Supabase emits INITIAL_SESSION or TOKEN_REFRESHED.
      if(!force &&
         authInitialised &&
         authLoadUserId===user.id &&
         authProject){
        authProjectLoading=false;
        authReady=true;
        render();
        return true;
      }

      authReady=true;
      authProjectLoading=true;
      authProject=null;
      authRole=null;
      authError="";
      render();

      const {data:member,error:memberError} = await withTimeout(
        supabaseClient
          .from("project_members")
          .select("project_id,role")
          .eq("user_id",user.id)
          .limit(1)
          .maybeSingle(),
        AUTH_REQUEST_TIMEOUT,
        "Das Projekt"
      );

      if(memberError) throw memberError;

      if(!member){
        authProject=null;
        authRole=null;
        authProjectLoading=false;
        authInitialised=false;
        authLoadUserId=user.id;
        authError="Der Login war erfolgreich, aber dieser Benutzer ist noch keinem Projekt zugeordnet.";
        render();
        return false;
      }

      const projectId=member.project_id;

      const {data:project,error:projectError}=await withTimeout(
        supabaseClient
          .from("projects")
          .select("id,name,renovation_budget")
          .eq("id",projectId)
          .single(),
        AUTH_REQUEST_TIMEOUT,
        "Die Projektdaten"
      );

      if(projectError) throw projectError;
      if(!project) throw new Error("Das Projekt wurde nicht gefunden.");

      authProject=projectId;
      authRole=member.role;
      authLoadUserId=user.id;
      authInitialised=true;

      state.currentUser=user.email||"Benutzer";
      state.currentRole=authRole;
      state.project.name=project.name;
      state.project.budget=Number(project.renovation_budget||0);

      // Authentication/project access is complete here.
      // Cloud data is loaded afterwards and can never block the login screen.
      authError="";
      authProjectLoading=false;
      authReady=true;
      render();

      loadSharedStateSafe().then(loaded=>{
        cloudStateLoaded=!!loaded;
        render();
      }).catch(err=>{
        console.error("Cloud-Laden:",err);
        cloudStateLoaded=false;
        supabaseSyncError=err?.message||String(err);
        render();
      });

      return true;
    }catch(e){
      console.error("Auth-Kontext:",e);
      authError=e?.message||String(e);
      authReady=true;
      authProjectLoading=false;
      authInitialised=false;
      render();
      return false;
    }finally{
      authLoadInFlight=null;
    }
  })();

  return authLoadInFlight;
}

async function loadSharedStateSafe(){
  if(!authProject||!authUser) return false;
  try{
    const result=await withTimeout(loadCloudState(),CLOUD_REQUEST_TIMEOUT,"Die Cloud-Daten");
    cloudStateLoaded=!!result;
    supabaseSyncError="";
    return !!result;
  }catch(e){
    console.error("Cloud-Laden:",e);
    cloudStateLoaded=false;
    supabaseSyncError=e?.message||String(e);
    return false;
  }
}

function newUuid(){
  if(window.crypto?.randomUUID) return crypto.randomUUID();
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,c=>{
    const r=Math.random()*16|0, v=c==="x"?r:(r&0x3|0x8);
    return v.toString(16);
  });
}

async function saveSharedStateSafe(){
  if(!authProject||!authUser||!cloudStateLoaded) return false;
  if(cloudSyncInFlight) return false;
  cloudSyncInFlight=true;
  try{
    const projectR=await supabaseClient.from("projects").update({
      name:state.project.name,
      renovation_budget:Number(state.project.budget||0),
      warning_yellow:Number(state.project.warningYellow||80),
      warning_red:Number(state.project.warningRed||100)
    }).eq("id",authProject);
    if(projectR.error) throw projectR.error;

    for(let ci=0;ci<state.categories.length;ci++){
      const c=state.categories[ci];
      const categoryId=(c.id&&/^[0-9a-f-]{36}$/i.test(c.id))?c.id:newUuid();
      c.id=categoryId;
      const r=await supabaseClient.from("categories").upsert({
        id:categoryId,project_id:authProject,name:c.name,
        sort_order:ci,archived:!!c.archived
      },{onConflict:"id"});
      if(r.error) throw r.error;

      for(let i=0;i<(c.posts||[]).length;i++){
        const p=c.posts[i];
        const postId=(p.id&&/^[0-9a-f-]{36}$/i.test(p.id))?p.id:newUuid();
        p.id=postId;
        const pr=await supabaseClient.from("cost_items").upsert({
          id:postId,category_id:categoryId,name:p.name,
          planned_budget:Number(p.budget||0),sort_order:i,archived:!!p.archived
        },{onConflict:"id"});
        if(pr.error) throw pr.error;
      }
    }

    for(const e of state.expenses){
      const id=(e.id&&/^[0-9a-f-]{36}$/i.test(e.id))?e.id:newUuid();
      e.id=id;
      const r=await supabaseClient.from("expenses").upsert({
        id,project_id:authProject,category_id:e.category||null,cost_item_id:e.post||null,
        amount:Number(e.amount||0),expense_date:e.date||null,expense_type:e.type||"sonstige",
        payer:e.payer||"Nicht angegeben",supplier:e.supplier||"",
        invoice_number:e.invoice||"",comment:e.comment||"",created_by:authUser.id
      },{onConflict:"id"});
      if(r.error) throw r.error;
    }

    for(const o of state.offers){
      const id=(o.id&&/^[0-9a-f-]{36}$/i.test(o.id))?o.id:newUuid();
      o.id=id;
      const r=await supabaseClient.from("offers").upsert({
        id,project_id:authProject,cost_item_id:o.post||null,supplier:o.supplier||"",
        offer_number:o.number||"",offer_date:o.date||null,valid_until:o.validUntil||null,
        amount:Number(o.amount||0),status:o.status||"offen",created_by:authUser.id
      },{onConflict:"id"});
      if(r.error) throw r.error;
    }

    // Metadata for documents is synchronized here. Actual file bytes use the
    // Supabase Storage upload path in uploadCloudDocument().
    for(const d of state.documents||[]){
      const id=(d.id&&/^[0-9a-f-]{36}$/i.test(d.id))?d.id:newUuid();
      d.id=id;
      const r=await supabaseClient.from("documents").upsert({
        id,project_id:authProject,expense_id:d.expenseId||null,offer_id:d.offer||null,
        category_id:d.category||null,cost_item_id:d.post||null,name:d.name||"Dokument",
        file_path:d.path||null,mime_type:d.mime_type||null,file_size:null,
        document_type:d.type||"Dokument",created_by:authUser.id
      },{onConflict:"id"});
      if(r.error) throw r.error;
    }

    localStorage.setItem(KEY,JSON.stringify(state));
    supabaseSyncError="";
    return true;
  }catch(e){
    console.error("Cloud-Speichern:",e);
    supabaseSyncError=e?.message||String(e);
    return false;
  }finally{
    cloudSyncInFlight=false;
  }
}

async function signIn(){
  const email=document.getElementById("authEmail")?.value.trim();
  const password=document.getElementById("authPassword")?.value;
  authError="";
  if(!email || !password){
    authError="Bitte E-Mail-Adresse und Passwort eingeben.";
    render();
    return;
  }

  const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});
  if(error){
    authError=error.message;
    render();
    return;
  }

  authUser=data.user||null;
  authInitialised=false;
  authLoadUserId=null;
  authProject=null;
  authRole=null;
  authProjectLoading=true;
  authReady=true;
  render();

  await loadAuthContext(true);
}

async function signOut(){
  await supabaseClient.auth.signOut();

  authUser=null;
  authProject=null;
  authRole=null;
  authError="";
  authProjectLoading=false;
  authReady=true;
  authInitialised=false;
  authLoadUserId=null;
  authLoadInFlight=null;
  cloudStateLoaded=false;

  render();
}

async function requestPasswordReset(){
  authError="";
  const email=document.getElementById("authEmail")?.value.trim();
  if(!email){authError="Bitte zuerst deine E-Mail-Adresse eingeben.";render();return;}
  const {error}=await supabaseClient.auth.resetPasswordForEmail(email,{
    redirectTo:"https://resthof-sanierung.vercel.app/"
  });
  if(error){authError=error.message;render();return;}
  authError="Eine E-Mail zum Zurücksetzen des Passworts wurde angefordert. Bitte prüfe dein Postfach.";
  render();
}

function authScreen(){
  if(!authReady) return '<div class="auth-screen"><div class="auth-card auth-loading">Verbindung wird hergestellt …</div></div>';
  if(authProjectLoading) return '<div class="auth-screen"><div class="auth-card auth-loading">Anmeldung erfolgreich.<br>Projekt wird geladen …</div></div>';
  if(authUser && authProject) return "";
  return `<div class="auth-screen"><div class="auth-card">
    <h1>🏗️ Resthofsanierung</h1>
    <p>Bitte melde dich an, um auf das Projekt zuzugreifen.</p>
    ${authError?`<div class="auth-error">${esc(authError)}</div>`:""}
    <div class="field"><label>E-Mail</label><input id="authEmail" type="email" autocomplete="username" placeholder="E-Mail-Adresse"></div>
    <div class="field" style="margin-top:12px"><label>Passwort</label><input id="authPassword" type="password" autocomplete="current-password" placeholder="Passwort"></div>
    <button class="btn primary" style="width:100%;margin-top:16px" onclick="signIn()">Anmelden</button>
    <button class="btn" style="width:100%;margin-top:8px" onclick="requestPasswordReset()">Passwort vergessen</button>
    <div class="muted" style="font-size:12px;margin-top:12px">Die Einladung wird über Supabase bestätigt. Ein Passwort wird von euch selbst festgelegt.</div>
  </div></div>`;
}

const FILE_DB="resthof_files_v1", FILE_STORE="files";
function fileDB(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(FILE_DB,1);
    req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains(FILE_STORE))req.result.createObjectStore(FILE_STORE);};
    req.onsuccess=()=>resolve(req.result); req.onerror=()=>reject(req.error);
  });
}
async function saveFileBlob(id,file){
  const db=await fileDB();
  await new Promise((resolve,reject)=>{
    const tx=db.transaction(FILE_STORE,"readwrite");
    tx.objectStore(FILE_STORE).put(file,id);
    tx.oncomplete=resolve; tx.onerror=()=>reject(tx.error);
  });
}
async function getFileBlob(id){
  const db=await fileDB();
  return await new Promise((resolve,reject)=>{
    const tx=db.transaction(FILE_STORE,"readonly");
    const req=tx.objectStore(FILE_STORE).get(id);
    req.onsuccess=()=>resolve(req.result); req.onerror=()=>reject(req.error);
  });
}
async function deleteFileBlob(id){
  if(!id)return;
  try{
    const db=await fileDB();
    await new Promise((resolve,reject)=>{
      const tx=db.transaction(FILE_STORE,"readwrite");
      tx.objectStore(FILE_STORE).delete(id);
      tx.oncomplete=resolve; tx.onerror=()=>reject(tx.error);
    });
  }catch(e){console.warn(e);}
}

function loadState(){
  try{
    const saved=JSON.parse(localStorage.getItem(KEY));
    const st=saved && saved.project ? saved : structuredClone(SEED);
    for(const e of (st.expenses||[])){
      if(typeof e.post!=="string") continue;
      for(const c of (st.categories||[])){
        const p=(c.posts||[]).find(x=>x.id===e.post||x.name===e.post);
        if(p){e.post=p.id;e.category=c.id;break;}
      }
    }
    return st;
  }catch(e){
    return structuredClone(SEED);
  }
}

function safeFileName(name){
  return String(name||"datei").replace(/[^a-zA-Z0-9._-]+/g,"_").slice(0,140);
}
async function uploadCloudDocument(file,meta={}){
  if(!authProject || !authUser) throw new Error("Nicht angemeldet.");
  if(!file) throw new Error("Keine Datei ausgewählt.");
  const id=uuid();
  const path=`${authProject}/${id}-${safeFileName(file.name)}`;
  const up=await supabaseClient.storage.from("resthof-documents").upload(path,file,{upsert:false,contentType:file.type||"application/octet-stream"});
  if(up.error) throw up.error;
  const row={
    id,project_id:authProject,expense_id:meta.expenseId||null,offer_id:meta.offerId||null,
    category_id:meta.categoryId||null,cost_item_id:meta.postId||null,name:meta.name||file.name,
    file_path:path,mime_type:file.type||null,file_size:file.size,document_type:meta.type||"Dokument",
    created_by:authUser.id
  };
  const ins=await supabaseClient.from("documents").insert(row).select().single();
  if(ins.error){
    await supabaseClient.storage.from("resthof-documents").remove([path]);
    throw ins.error;
  }
  return {...row,size:`${(file.size/1024/1024).toFixed(2)} MB`,linked:true};
}
async function signedDocumentUrl(path){
  const r=await supabaseClient.storage.from("resthof-documents").createSignedUrl(path,3600);
  if(r.error) throw r.error;
  return r.data.signedUrl;
}
async function deleteCloudDocument(doc){
  if(!doc)return;
  if(doc.path){
    const r=await supabaseClient.storage.from("resthof-documents").remove([doc.path]);
    if(r.error) console.warn("Storage-Löschen:",r.error);
  }
  if(doc.id){
    const r=await supabaseClient.from("documents").delete().eq("id",doc.id).eq("project_id",authProject);
    if(r.error) throw r.error;
  }
}

async function openAnyDocument(url,id,type){
  try{
    if(url){openStandaloneDocument(url,type);return;}
    const doc=state.documents.find(d=>d.id===id);
    if(doc?.path){openStandaloneDocument(await signedDocumentUrl(doc.path),doc.type||type);return;}
    const blob=await getFileBlob(id);
    if(!blob){alert("Die Datei wurde nicht gefunden.");return;}
    openStandaloneDocument(URL.createObjectURL(blob),type);
  }catch(err){console.error(err);alert("Die Datei konnte nicht geöffnet werden.");}
}

function addExpenseDocument(expenseId){if(!canEdit())return;
  const input=document.createElement("input"); input.type="file"; input.accept=".pdf,.jpg,.jpeg,.png";
  input.onchange=async()=>{
    const f=input.files[0]; if(!f)return;

    const e=state.expenses.find(x=>x.id===expenseId); if(!e)return;
    try{
      const ext=(f.name.split(".").pop()||"").toLowerCase();
      const type=ext==="pdf"?"PDF":(["jpg","jpeg","png"].includes(ext)?"Bild":"Dokument");
      const doc=await uploadCloudDocument(f,{expenseId,type,name:f.name,categoryId:e.category,postId:e.post});

  };

}
async function openDocument(expenseId,index){
  const e=state.expenses.find(x=>x.id===expenseId), d=e?.docs?.[index];
  if(!d)return;
  try{
    if(d.path){openStandaloneDocument(await signedDocumentUrl(d.path),d.type);return;}
    if(d.url){openStandaloneDocument(d.url,d.type);return;}
    const blob=await getFileBlob(d.id);
    if(!blob){alert("Die Datei wurde nicht gefunden.");return;}
    openStandaloneDocument(URL.createObjectURL(blob),d.type);
  }catch(err){console.error(err);alert("Die Datei konnte nicht geöffnet werden.");}
}
function openStandaloneDocument(url,type){
  const w=window.open("","_blank");
  if(!w){alert("Bitte Pop-ups erlauben, um das Dokument zu öffnen.");return;}
  if(type==="PDF"){
    w.document.write(`<iframe src="${url}" style="position:fixed;inset:0;width:100%;height:100%;border:0"></iframe>`);
  }else{
    w.document.write(`<body style="margin:0;background:#111;display:flex;align-items:center;justify-content:center;min-height:100vh"><img src="${url}" style="max-width:100%;max-height:100vh;object-fit:contain"></body>`);
  }
  w.document.close();
}
function removeExpenseDocument(expenseId,index){
  const e=state.expenses.find(x=>x.id===expenseId); if(!e||!e.docs)return;
  const d=e.docs[index];
  if(confirm(`„${d.name}“ wirklich entfernen?`)){
    e.docs.splice(index,1);
    const finish=async()=>{try{await deleteCloudDocument(d);}catch(err){console.error(err);alert("Die Cloud-Datei konnte nicht vollständig gelöscht werden.");}finally{
      state.documents=state.documents.filter(x=>x.id!==d.id); save(); openExpense(expenseId);
    }};
    finish();
  }
}

  const {error}=await withTimeout(

  );
  if(error) throw error;
}

function openCameraForDoc(){ document.getElementById("dCamera").click(); }
function openFileForDoc(){ document.getElementById("dFile").click(); }
function setDocFile(input){
  const f=input.files[0]; if(!f)return;
  const normal=document.getElementById("dFile");
  const camera=document.getElementById("dCamera");
  // Keep the selected File object available through the normal input reference
  // when the source was the camera.
  if(input===camera){
    try{
      const dt=new DataTransfer();
      dt.items.add(f);
      normal.files=dt.files;
    }catch(e){}
  }
  document.getElementById("dFileName").textContent=f.name;
}
async function addDoc(post){if(!canEdit())return;
  const f=document.getElementById("dFile")?.files?.[0];
  if(!f){alert("Bitte zuerst eine Datei auswählen.");return;}
  if(f.size>20*1024*1024){alert("Die Datei darf maximal 20 MB groß sein.");return;}

  const docId="d-"+crypto.randomUUID();
  const doc={
    id:docId,
    name:document.getElementById("dCustomName")?.value.trim()||document.getElementById("dName")?.value.trim()||f.name,
    type:document.getElementById("dType").value,
    supplier:document.getElementById("dSupplier").value,
    number:document.getElementById("dNumber").value,
    post:post||null,
    linked:!!post
  };

  try{
    await saveFileBlob(docId,f);
    state.documents.push(doc);
    save();
    closeModal();
  }catch(err){
    console.error(err);
    await deleteFileBlob(docId);
    alert("Das Dokument konnte nicht gespeichert werden: "+(err?.message||String(err)));
  }
}

// Register the auth listener before the initial session check.
// The initial session is handled by the explicit loadAuthContext() call below.
// SIGNED_IN is already handled by signIn(), and TOKEN_REFRESHED must not
// restart the project lookup.
supabaseClient.auth.onAuthStateChange((event,session)=>{
  authUser=session?.user||null;

  if(event==="PASSWORD_RECOVERY"){
    inviteMode=false;
  }

  if(!authUser){
    authProject=null;
    authRole=null;
    cloudStateLoaded=false;
    authProjectLoading=false;
    authReady=true;
    authInitialised=false;
    authLoadUserId=null;
    authLoadInFlight=null;
    render();
    return;
  }

  if(event==="TOKEN_REFRESHED"){
    // Token refresh does not require another project lookup.
    authUser=session.user;
    return;
  }

  if(event==="SIGNED_IN"){
    // signIn() explicitly calls loadAuthContext(true), so do not start
    // another competing project lookup here.
    return;
  }

  if(event==="INITIAL_SESSION"){
    // Defer only the initial session handling until the auth callback has
    // returned, avoiding Supabase's internal auth lock.
    setTimeout(()=>{
      loadAuthContext().catch(e=>{
        console.error("Initial Auth-Kontext:",e);
        authError=e?.message||String(e);
        authReady=true;
        authProjectLoading=false;
        render();
      });
    },0);
  }
});
